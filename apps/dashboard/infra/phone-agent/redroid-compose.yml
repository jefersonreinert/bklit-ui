# Android virtual (Redroid) controlado pelo Mobilerun — ADB só em 127.0.0.1
services:
  android:
    image: redroid/redroid:13.0.0-latest
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./data:/data
    cpus: 2
    mem_limit: 3g
    command:
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=2340
      - androidboot.redroid_dpi=420
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_fps=15
