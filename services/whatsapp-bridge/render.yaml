# Render Blueprint (free web service). Created through the Render API by the
# dashboard setup; kept here as documentation of the service settings.
services:
  - type: web
    name: casa-brasa-wa
    runtime: docker
    plan: free
    region: oregon
    rootDir: services/whatsapp-bridge
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BRIDGE_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MEDIA_HISTORY_DAYS
        value: "180"
      - key: MEDIA_MAX_MB
        value: "16"
