# Render Blueprint (free web service). Created through the Render API by the
# dashboard setup; kept here as documentation of the service settings.
services:
  - type: web
    name: casa-brasa-whatsapp
    runtime: docker
    plan: free
    region: oregon
    rootDir: services/whatsapp-bridge
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BRIDGE_SECRET
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_SESSION_REPO
        value: JefersonReinert/casa-brasa-wa-session
