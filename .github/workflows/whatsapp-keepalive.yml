name: WhatsApp keep-alive

# The WhatsApp bridge runs on Render's free plan, which sleeps after 15 min
# without traffic (and would drop the WhatsApp link). Ping it every 10 min.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping bridge
        env:
          BRIDGE_URL: ${{ vars.WHATSAPP_BRIDGE_URL || 'https://casa-brasa-whatsapp.onrender.com' }}
        run: curl -fsS --max-time 90 --retry 2 "$BRIDGE_URL/health" || true
