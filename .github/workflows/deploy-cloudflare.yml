name: Deploy dashboard to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/ui/**"
      - "packages/icons/**"
      - "packages/studio/src/styles/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Repository secrets (Settings → Secrets and variables → Actions)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: publishes the Convex functions, schema and crons first
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.secrets.outputs.ok == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.secrets.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy Convex (functions, schema, crons)
        if: steps.secrets.outputs.ok == 'true' && env.CONVEX_DEPLOY_KEY != ''
        working-directory: apps/dashboard
        run: npx convex deploy

      - name: Build and deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/dashboard
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
